name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Grant explicit permissions for GHCR image pushes and Security scan SARIF uploads
permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: services/api-gateway/package-lock.json
      
      - name: Install dependencies
        run: |
          cd services/api-gateway
          npm ci
      
      - name: Run tests
        run: |
          cd services/api-gateway
          npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    strategy:
      matrix:
        service:
          - api-gateway
          - user-service
          - gamification-service
          - ai-service
    
    steps:
      - uses: actions/checkout@v3

      # Docker requires registry repositories to be completely lowercase (Tejas3479 -> tejas3479)
      - name: Lowercase Registry Image Prefix
        run: |
          echo "IMAGE_PREFIX=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Lowercase Registry Image Prefix
        run: |
          echo "IMAGE_PREFIX=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    needs: [build-and-push, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3

      - name: Lowercase Registry Image Prefix
        run: |
          echo "IMAGE_PREFIX=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
      
      - name: Validate Kubeconfig Secret and Server URL
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_SECRET" ]; then
            echo "::error::GitHub Secret 'KUBECONFIG' is EMPTY or NOT CONFIGURED! Please add KUBECONFIG in Repository Settings -> Secrets."
            exit 1
          fi
          
          if echo "$KUBECONFIG_SECRET" | grep -q "apiVersion"; then
            CONFIG_TEXT="$KUBECONFIG_SECRET"
          else
            CONFIG_TEXT=$(echo "$KUBECONFIG_SECRET" | base64 -d 2>/dev/null || echo "")
          fi
          
          if [ -z "$CONFIG_TEXT" ]; then
            echo "::error::KUBECONFIG secret content could not be decoded or parsed!"
            exit 1
          fi
          
          SERVER_URL=$(echo "$CONFIG_TEXT" | grep "server:" | awk '{print $2}' | head -n 1)
          echo "Configured Kubernetes Server API: $SERVER_URL"
          
          if echo "$SERVER_URL" | grep -qE "localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0"; then
            echo "::error::Your KUBECONFIG secret points to a LOCAL cluster address ($SERVER_URL)!"
            echo "::error::Because GitHub Actions runs on a remote runner, it cannot connect to 'localhost' or '127.0.0.1' of your local computer."
            echo "::error::Please configure a remote Kubernetes cluster with a public API endpoint or use a tunnel, and update the GITHUB secret 'KUBECONFIG'."
            exit 1
          fi
      
      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
      
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/api-gateway api-gateway=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }} -n ecofarm
          kubectl rollout status deployment/api-gateway -n ecofarm
